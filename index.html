<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dino Clima Dinâmico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <div class="score-board">
            <span id="high-score">HI 00000</span>
            <span id="current-score">00000</span>
        </div>

        <div class="game season-autumn">
            <div id="weather-overlay"></div>

            <div id="dino"></div>
            <div id="obstacle" class="obstacle-cactus"></div>

            <div id="game-over-screen" class="hidden">
                <h2>G A M E &nbsp; O V E R</h2>
                <button id="restart-btn">🔄</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
